name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build + testes unitários (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: Testes E2E (Python + Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # gera public/js: o servidor estático só serve o que já está compilado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependências do Python
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar o Chromium do Playwright
        working-directory: e2e
        run: playwright install --with-deps chromium

      - name: Rodar a suíte E2E
        working-directory: e2e
        run: pytest -v
        # A fixture `servidor` em conftest.py sobe o site sozinha, porque
        # aqui não há um segundo terminal com `npm run dev`.

      - name: Guardar evidências de falha (trace e screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7
